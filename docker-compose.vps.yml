# Déploiement sur un VPS géré par un panneau (FASTPANEL, Plesk, cPanel…).
#
# LE PANNEAU GARDE LES PORTS 80 ET 443. Il possède nginx, ses certificats
# Let's Encrypt et ses vhosts ; lui poser un second serveur web en face, c'est
# un conflit de ports au premier redémarrage et un certificat qui cesse de se
# renouveler sans prévenir. On reste donc DERRIÈRE lui : l'application n'écoute
# que sur la boucle locale, le nginx du panneau lui parle en proxy.
#
# ⚠️ `127.0.0.1:8080` ET PAS `8080` TOUT COURT. Publier le port sur toutes les
# interfaces rendrait l'application joignable en direct sur l'IP du VPS, hors
# du nginx — et comme l'application fait confiance aux en-têtes de proxy
# (`trustProxies`), n'importe qui pourrait alors forger son adresse IP et vider
# les seaux de la limitation de débit, ou s'en servir pour enfermer un autre
# utilisateur dehors. Le deux-points de gauche n'est pas cosmétique.

# Nom de projet EXPLICITE. Implicite, Compose le déduirait du dossier
# (« dolibarr ») : un autre projet du même nom sur la machine partagerait ses
# volumes, et `--remove-orphans` supprimerait ses conteneurs. Fixé AVANT le
# premier déploiement, et à ne plus changer : renommer après coup ferait
# repartir sur des volumes neufs, et la base existante disparaîtrait de la vue.
name: dolibarr-maroc

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dolibarr-maroc:vps
    restart: unless-stopped
    env_file: .env.vps
    environment:
      PORT: 8080
      # Mono-instance : les migrations au démarrage sont sûres ici, là où sur
      # plusieurs instances elles se marcheraient dessus.
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Le système de fichiers d'un conteneur est jetable : les journaux et les
      # fichiers déposés doivent lui survivre.
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # ⚠️ Ces `${…}` sont lus à l'ANALYSE du fichier — depuis le shell ou le
    # fichier passé en `--env-file`, JAMAIS depuis `env_file:` ci-dessous, qui
    # ne nourrit que l'environnement du conteneur. Lancé sans `--env-file`,
    # PostgreSQL démarrait avec un mot de passe VIDE et refusait de
    # s'initialiser. Le `:?` fait échouer Compose tout de suite, avec la raison,
    # au lieu de laisser démarrer une base cassée.
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant — lancez avec --env-file .env.vps}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant — lancez avec --env-file .env.vps}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant — lancez avec --env-file .env.vps}
      # Collation ICU française : le tri des noms respecte les accents
      # (« Épicerie » avant « Zahra »). Un simple LANG ne suffit pas sur une
      # image Alpine — musl n'a pas de tables de collation, le tri resterait à
      # l'octet. ICU, lui, est embarqué dans l'image officielle. Ne joue qu'à
      # la PREMIÈRE création du volume.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR"
    env_file: .env.vps
    # AUCUN port publié : seule l'application, sur le réseau interne de Compose,
    # a besoin d'y accéder. Une base PostgreSQL exposée sur Internet se fait
    # trouver en quelques heures.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` seul n'attend que le DÉMARRAGE du conteneur, pas que
      # PostgreSQL accepte des connexions : sans ce contrôle, la première
      # migration part trop tôt une fois sur deux.
      # `$$` : évalué DANS le conteneur, à chaque sonde, depuis ses propres
      # variables — pas figé à l'analyse du fichier.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # Sauvegarde quotidienne de la base, gardée 14 jours.
  #
  # Ce n'est pas du luxe : sans elle, une erreur de manipulation sur un serveur
  # que vous administrez vous-même est définitive. Cloud SQL sauvegardait pour
  # vous ; ici, personne ne le fait à votre place.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.vps
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sauvegardes:/sauvegardes
    # Bloc LITTÉRAL (`|`) en forme liste, pas un bloc plié (`>`). Dans un bloc
    # plié, les lignes plus indentées GARDENT leur retour à la ligne : le `&&`
    # se retrouvait en tête de ligne, `sh` refusait la syntaxe, et le conteneur
    # plantait en boucle — on croyait avoir des sauvegardes, il n'y en avait
    # aucune.
    entrypoint:
      - sh
      - -c
      - |
        # Les dumps contiennent TOUTE la base (tiers, factures, mots de passe
        # hachés, sessions). Avec l'umask par défaut ils sortaient en 0644,
        # lisibles par tous les comptes du VPS — dont l'utilisateur PHP des
        # sites voisins : une seule faille WordPress suffisait à les emporter.
        umask 077
        while true; do
          f="/sauvegardes/dolibarr-$$(date +%Y%m%d-%H%M).dump"
          # Écrit sous un nom temporaire, renommé seulement si pg_dump réussit :
          # un dump interrompu ne doit jamais ressembler à une sauvegarde valide.
          if PGPASSWORD="$$DB_PASSWORD" pg_dump -h db -U "$$DB_USERNAME" -d "$$DB_DATABASE" -Fc -f "$$f.partiel" 2>/sauvegardes/derniere-erreur.log; then
            mv "$$f.partiel" "$$f"
            find /sauvegardes -name 'dolibarr-*.dump' -mtime +14 -delete
          else
            rm -f "$$f.partiel"
          fi
          sleep 86400
        done

volumes:
  db-data:
  app-storage:
  app-logs:
